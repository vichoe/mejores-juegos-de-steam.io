<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fisicalización | Torre de Juegos</title>
  <style>
    :root {
      --fondo: #0b0e14;
      --panel: rgba(26, 28, 44, 0.92);
      --texto: #f4f6fb;
      --suave: #bfc7d8;
      --cyan: #00d2c8;
      --dorado: #f5c518;
      --borde: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(0, 210, 200, 0.14), transparent 28%),
        radial-gradient(circle at bottom left, rgba(245, 197, 24, 0.12), transparent 32%),
        var(--fondo);
    }

    main {
      width: min(100% - 32px, 980px);
      margin: 0 auto;
      padding: 34px 0 42px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: 0.5px;
    }

    .subtitulo {
      max-width: 760px;
      margin: 12px 0 22px;
      color: var(--suave);
      line-height: 1.55;
      font-size: 1.05rem;
    }

    .controles {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 17px;
      color: #071012;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    button:hover { transform: translateY(-2px); filter: brightness(1.08); }
    button:active { transform: translateY(0); }

    #btnNuevaTorre { background: var(--cyan); }
    #btnActivarSonido { background: var(--dorado); }

    /* Selector de género */
    .filtro-genero {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding: 14px 16px;
      border: 1px solid var(--borde);
      border-radius: 13px;
      background: var(--panel);
    }

    .filtro-genero label {
      color: var(--suave);
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .filtro-genero select {
      background: rgba(0,0,0,0.4);
      color: var(--texto);
      border: 1px solid var(--cyan);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.95rem;
      cursor: pointer;
      outline: none;
      flex: 1;
      min-width: 180px;
    }

    .filtro-genero select:focus {
      border-color: var(--dorado);
    }

    #contadorGenero {
      color: var(--cyan);
      font-size: 0.88rem;
      white-space: nowrap;
    }

    #mapa {
      width: 100%;
      height: min(68vh, 590px);
      min-height: 500px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--borde);
      border-radius: 20px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        rgba(8, 12, 20, 0.84);
      background-size: 30px 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.38);
    }

    #mapa::before {
      content: "Explora la torre inclinando tu teléfono";
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.38);
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .bloque-juego {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: absolute;
      min-width: 0;
      height: 42px;
      padding: 0 12px;
      border: 1px solid rgba(12, 16, 25, 0.42);
      border-radius: 10px;
      color: #111827;
      box-shadow: 0 6px 13px rgba(0, 0, 0, 0.28);
      font-size: clamp(0.72rem, 1.9vw, 0.88rem);
      font-weight: 800;
      user-select: none;
      background: linear-gradient(90deg, #00d2c8, #67e8d8);
    }

    .nombre-juego {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .precio-juego {
      flex: 0 0 auto;
      padding-left: 8px;
      font-variant-numeric: tabular-nums;
    }

    #cursor {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 10;
      transform: translate(-50%, -50%);
      color: #fff;
      border: 3px solid #ff9f1c;
      border-radius: 50%;
      background: rgba(255, 159, 28, 0.16);
      box-shadow: 0 0 0 7px rgba(255, 159, 28, 0.12);
      pointer-events: none;
      font-weight: 900;
    }

    #info {
      min-height: 54px;
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px solid var(--borde);
      border-radius: 13px;
      background: var(--panel);
      color: var(--suave);
      line-height: 1.45;
    }

    #info strong { color: #fff; }

    @media (max-width: 560px) {
      main { width: min(100% - 20px, 980px); padding-top: 22px; }
      #mapa { min-height: 500px; }
      .controles button { width: 100%; }
      #mapa::before { font-size: 0.74rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Torre de Juegos</h1>
    <p class="subtitulo">
      Cada torre contiene 10 juegos aleatorios. Al acercarte a un juego,
      más rating = sonido más agudo y vibración más intensa.
    </p>

    <div class="controles">
      <button id="btnNuevaTorre" type="button">🎲 Elegir otros 10 juegos</button>
      <button id="btnActivarSonido" type="button">🔊 Activar sonido</button>
    </div>

    <div class="filtro-genero">
      <label for="selectorGenero">Filtrar por tag de steam:</label>
      <select id="selectorGenero">
        <option value="">Todos los tags</option>
        <option value="Action">Action</option>
        <option value="Adventure">Adventure</option>
        <option value="Casual">Casual</option>
        <option value="Early Access">Early Access</option>
        <option value="Free To Play">Free To Play</option>
        <option value="Gore">Gore</option>
        <option value="Indie">Indie</option>
        <option value="Massively Multiplayer">Massively Multiplayer</option>
        <option value="Nudity">Nudity</option>
        <option value="RPG">RPG</option>
        <option value="Racing">Racing</option>
        <option value="Sexual Content">Sexual Content</option>
        <option value="Simulation">Simulation</option>
        <option value="Sports">Sports</option>
        <option value="Strategy">Strategy</option>
        <option value="Violent">Violent</option>
      </select>
      <span id="contadorGenero"></span>
    </div>

    <div id="mapa" aria-label="Torre interactiva de diez juegos">
      <div id="cursor">+</div>
    </div>

    <div id="info" aria-live="polite">Cargando juegos para la primera torre…</div>
  </main>

  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>
  <script>
    const mapa             = document.getElementById("mapa");
    const cursor           = document.getElementById("cursor");
    const info             = document.getElementById("info");
    const btnNuevaTorre    = document.getElementById("btnNuevaTorre");
    const btnActivarSonido = document.getElementById("btnActivarSonido");
    const selectorGenero   = document.getElementById("selectorGenero");
    const contadorGenero   = document.getElementById("contadorGenero");

    let todosLosJuegos = [];
    let juegosTorre    = [];
    let audioCtx       = null;
    let ultimoClic     = 0;

    // --- Utilidades ---
    function mezclarArreglo(arreglo) {
      const copia = [...arreglo];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    function formatearPrecio(precio) {
      return Number(precio).toLocaleString("en-US", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }

    function mapear(valor, entradaMin, entradaMax, salidaMin, salidaMax) {
      if (entradaMax === entradaMin) return salidaMin;
      return salidaMin + ((valor - entradaMin) / (entradaMax - entradaMin)) * (salidaMax - salidaMin);
    }

    function tomarPonderados(arreglo, cantidad, usados) {
      const disponibles = arreglo.filter(j => !usados.has(j));
      if (disponibles.length <= cantidad) {
        disponibles.forEach(j => usados.add(j));
        return disponibles;
      }

      const maxOwners   = Math.max(...disponibles.map(j => Number(j["Estimated owners"]) || 0)) || 1;
      const maxPlaytime = Math.max(...disponibles.map(j => Number(j["Average playtime forever"]) || 0)) || 1;

      // Peso = 70% owners + 30% playtime, normalizado
      const pesos = disponibles.map(j => {
        const wOwners   = (Number(j["Estimated owners"]) || 0) / maxOwners;
        const wPlaytime = (Number(j["Average playtime forever"]) || 0) / maxPlaytime;
        return 0.7 * wOwners + 0.3 * wPlaytime + 0.05; // +0.05 para que nadie tenga peso 0
      });

      const seleccion = [];
      const pesosCopia = [...pesos];
      const dispCopia  = [...disponibles];

      for (let i = 0; i < cantidad && dispCopia.length > 0; i++) {
        const total = pesosCopia.reduce((s, p) => s + p, 0);
        let rand = Math.random() * total;
        let idx  = 0;
        for (idx = 0; idx < pesosCopia.length; idx++) {
          rand -= pesosCopia[idx];
          if (rand <= 0) break;
        }
        idx = Math.min(idx, dispCopia.length - 1);
        seleccion.push(dispCopia[idx]);
        usados.add(dispCopia[idx]);
        dispCopia.splice(idx, 1);
        pesosCopia.splice(idx, 1);
      }

      return seleccion;
    }

    function tomarAleatorios(arreglo, cantidad, usados) {
      const disponibles = arreglo.filter(j => !usados.has(j));
      const seleccion   = mezclarArreglo(disponibles).slice(0, cantidad);
      seleccion.forEach(j => usados.add(j));
      return seleccion;
    }

    function limpiarTorre() {
      mapa.querySelectorAll(".bloque-juego").forEach(b => b.remove());
    }

    function tieneGenero(juego, genero) {
      if (!genero) return true;
      const tags = (juego.Tags || "").split(",").map(t => t.trim());
      return tags.includes(genero);
    }

    async function cargarDatosTorre() {
      try {
        const respuesta = await fetch("datos/datos_radar.json");
        if (!respuesta.ok) throw new Error("No se pudo leer datos/datos_radar.json.");

        const datos       = await respuesta.json();
        const nombresUsados = new Set();

        todosLosJuegos = datos.filter(juego => {
          const nombre = typeof juego.Name === "string" ? juego.Name.trim() : "";
          const precio = Number(juego.Price);
          const rating = Number(juego.rating);
          if (!nombre || nombresUsados.has(nombre) || !Number.isFinite(precio) || !Number.isFinite(rating)) return false;
          nombresUsados.add(nombre);
          return true;
        });

        if (todosLosJuegos.length < 10) throw new Error("No hay suficientes juegos válidos.");
        generarNuevaTorre();
      } catch (error) {
        info.textContent = `❌ Error al cargar los datos: ${error.message}`;
      }
    }

    function generarNuevaTorre() {
      const generoSeleccionado = selectorGenero.value;

      const base = generoSeleccionado
        ? todosLosJuegos.filter(j => tieneGenero(j, generoSeleccionado))
        : todosLosJuegos;

      contadorGenero.textContent = generoSeleccionado
        ? `${base.length} juegos disponibles`
        : "";

      if (base.length < 10) {
        info.textContent = `❌ Solo hay ${base.length} juegos con el género "${generoSeleccionado}". Necesitas al menos 10.`;
        return;
      }

      const buenos      = base.filter(j => Number(j.rating) >= 85);
      const malos       = base.filter(j => Number(j.rating) > 0 && Number(j.rating) <= 60);
      const intermedios = base.filter(j => Number(j.rating) > 60 && Number(j.rating) < 85);

      const usados = new Set();

      const seleccionBuenos = buenos.length >= 2
        ? tomarPonderados(buenos, 2, usados).map(j => ({ ...j, categoria: "bueno" }))
        : tomarPonderados(base, 2, usados).map(j => ({ ...j, categoria: "bueno" }));

      const seleccionMalos = malos.length >= 2
        ? tomarPonderados(malos, 2, usados).map(j => ({ ...j, categoria: "malo" }))
        : tomarPonderados(base, 2, usados).map(j => ({ ...j, categoria: "malo" }));

      let seleccionIntermedios = tomarPonderados(intermedios, 6, usados).map(j => ({ ...j, categoria: "intermedio" }));

      if (seleccionIntermedios.length < 6) {
        const faltantes = 6 - seleccionIntermedios.length;
        const respaldo  = tomarPonderados(base, faltantes, usados).map(j => ({ ...j, categoria: "intermedio" }));
        seleccionIntermedios = [...seleccionIntermedios, ...respaldo];
      }

      let seleccionFinal = mezclarArreglo([
        ...seleccionBuenos,
        ...seleccionMalos,
        ...seleccionIntermedios
      ]).slice(0, 10);

      const UMBRAL_MUY_POPULAR = 2999999;
      const UMBRAL_POPULAR     = 999999;

      function garantizarPopulares(seleccion, pool, usadosSet) {
        let resultado = [...seleccion];

        const muyPop = resultado.filter(j => Number(j["Estimated owners"]) > UMBRAL_MUY_POPULAR);
        const pop    = resultado.filter(j => Number(j["Estimated owners"]) > UMBRAL_POPULAR);

        const extraPool = pool
          .filter(j => !usadosSet.has(j))
          .sort((a, b) => Number(b["Estimated owners"]) - Number(a["Estimated owners"]));

        function reemplazarConUmbral(umbral) {
          const candidato = extraPool.find(j => Number(j["Estimated owners"]) > umbral);
          if (!candidato) return false;
          const idxReemplazar = resultado
            .map((j, i) => ({ i, owners: Number(j["Estimated owners"]) }))
            .filter(x => x.owners <= umbral)
            .sort((a, b) => a.owners - b.owners)[0]?.i;
          if (idxReemplazar === undefined) return false;
          usadosSet.add(candidato);
          extraPool.splice(extraPool.indexOf(candidato), 1);
          resultado[idxReemplazar] = candidato;
          return true;
        }

        if (muyPop.length < 1) reemplazarConUmbral(UMBRAL_MUY_POPULAR);

        const popActuales = resultado.filter(j => Number(j["Estimated owners"]) > UMBRAL_POPULAR);
        let faltanPop = 3 - popActuales.length;
        while (faltanPop > 0) {
          if (!reemplazarConUmbral(UMBRAL_POPULAR)) break;
          faltanPop--;
        }

        return resultado;
      }

      seleccionFinal = garantizarPopulares(seleccionFinal, base, usados);

      juegosTorre = seleccionFinal.map((juego, indice) => ({
        nombre:    juego.Name,
        precio:    Number(juego.Price) || 0,
        rating:    Number(juego.rating) || 0,
        owners:    Number(juego["Estimated owners"]) || 0,
        playtime:  Number(juego["Average playtime forever"]) || 0,
        tags:      juego.Tags || "",
        categoria: juego.categoria,
        nivel:     indice + 1
      }));

      juegosTorre.sort((a, b) => a.precio - b.precio);

      dibujarTorre();

      const textoGenero = generoSeleccionado ? ` de <strong>${generoSeleccionado}</strong>` : "";
      info.innerHTML = `Sincroniza tu telefono e inclinalo para explorar los juegos`;
      Protobject.Core.send({ torreActualizada: true }).to("sensor.html");
    }

    // --- Dibujar torre ---
    function dibujarTorre() {
      limpiarTorre();

      const altoMapa     = mapa.clientHeight;
      const anchoMapa    = mapa.clientWidth;
      const altoBloque   = 42;
      const separacion   = 10;
      const totalBloques = juegosTorre.length;
      const anchoBloque  = Math.min(440, anchoMapa - 48);
      const alturaTotal  = totalBloques * altoBloque + (totalBloques - 1) * separacion;
      const inicioY      = (altoMapa - alturaTotal) / 2;
      const baseX        = anchoMapa / 2;

      juegosTorre.forEach((juego, indice) => {
        const y = inicioY + (totalBloques - 1 - indice) * (altoBloque + separacion) + altoBloque / 2;
        const x = baseX;

        juego.cx = x;
        juego.cy = y;
        juego.w  = anchoBloque;
        juego.h  = altoBloque;

        const bloque = document.createElement("div");
        const nombre = document.createElement("span");
        const precio = document.createElement("span");

        bloque.className   = "bloque-juego";
        bloque.style.left  = `${x - anchoBloque / 2}px`;
        bloque.style.top   = `${y - altoBloque / 2}px`;
        bloque.style.width = `${anchoBloque}px`;
        bloque.title       = `${juego.nombre} · Rating ${juego.rating}% · Precio $${formatearPrecio(juego.precio)}`;

        nombre.className   = "nombre-juego";
        nombre.textContent = `${10 - indice}. ${juego.nombre}`;

        precio.className   = "precio-juego";
        precio.textContent = `$${formatearPrecio(juego.precio)}`;

        bloque.append(nombre, precio);
        mapa.appendChild(bloque);
      });
    }

    // --- Distancia al rectángulo ---
    function distanciaARectangulo(px, py, juego) {
      const dx = Math.max(Math.abs(px - juego.cx) - juego.w / 2, 0);
      const dy = Math.max(Math.abs(py - juego.cy) - juego.h / 2, 0);
      return Math.sqrt(dx * dx + dy * dy);
    }

    // --- Audio ---
    async function activarSonido() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      btnActivarSonido.textContent = "✓ Sonido activado";
      info.textContent = "Sonido activado. Mueve el celular cerca de un bloque.";
    }

    function hacerClic(frecuencia, duracion, volumen = 0.28) {
      if (!audioCtx || audioCtx.state !== "running") return;
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = "triangle";
      osc.frequency.setValueAtTime(frecuencia, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(volumen, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracion);
      osc.start();
      osc.stop(audioCtx.currentTime + duracion);
    }

    function potenciaPorRating(r) {
      if (r > 94)      return 1.00;
      if (r >= 85)     return 0.80;
      if (r >= 70)     return 0.60;
      if (r >= 50)     return 0.45;
      return 0.20;
    }

    function sonarSegunRating(rating = 50) {
      const r          = Math.max(0, Math.min(Number(rating) || 0, 100));
      const potencia   = potenciaPorRating(r);
      const frecuencia = mapear(potencia, 0.20, 1.00, 180, 1200);
      const duracion   = mapear(potencia, 0.20, 1.00, 0.04, 0.18);
      const volumen    = mapear(potencia, 0.20, 1.00, 0.08, 0.55);
      hacerClic(frecuencia, duracion, volumen);
    }

    function patronVibracionSegunRating(rating = 50) {
      const r        = Math.max(0, Math.min(Number(rating) || 0, 100));
      const potencia = potenciaPorRating(r);
      const base     = 120; // duración máxima de pulso

      const duracion = Math.round(base * potencia);
      const pausa    = 40;

      if (r > 94)  return [duracion, pausa, duracion, pausa, duracion, pausa, duracion]; // 4 pulsos
      if (r >= 85) return [duracion, pausa, duracion, pausa, duracion];                  // 3 pulsos
      if (r >= 70) return [duracion, pausa, duracion];                                   // 2 pulsos
      if (r >= 50) return [duracion];                                                    // 1 pulso medio
      return [Math.round(base * 0.20)];                                                  // 1 pulso corto
    }

    function duracionTotalPatron(patron) {
      return patron.reduce((total, t) => total + t, 0);
    }

    // --- Movimiento del cursor ---
    function procesarMovimiento(datos) {
      const x         = Number(datos.x);
      const yOriginal = Number(datos.y);
      if (!Number.isFinite(x) || !Number.isFinite(yOriginal)) return;

      const y = 100 - yOriginal;
      cursor.style.left = `50%`;
      cursor.style.top  = `${y}%`;

      const px = mapa.clientWidth  * 0.5;
      const py = mapa.clientHeight * y / 100;

      let distanciaMinima = Infinity;
      let juegoCercano    = null;

      juegosTorre.forEach(juego => {
        const dist = distanciaARectangulo(px, py, juego);
        if (dist < distanciaMinima) { distanciaMinima = dist; juegoCercano = juego; }
      });

      if (!juegoCercano || distanciaMinima >= 85) {
        info.textContent = "Mueve el cursor hacia un bloque de la torre.";
        return;
      }

      const ahora    = Date.now();
      const patron   = patronVibracionSegunRating(juegoCercano.rating);
      const intervalo = Math.max(750, duracionTotalPatron(patron) + 180);

      if (ahora - ultimoClic > intervalo) {
        sonarSegunRating(juegoCercano.rating);
        Protobject.Core.send({ vibrar: true, patron }).to("sensor.html");
        ultimoClic = ahora;
      }

      if (distanciaMinima < 9) {
        info.innerHTML = `¡Encontraste <strong>${juegoCercano.nombre}</strong>! ` +
          `Precio: <strong>$${formatearPrecio(juegoCercano.precio)}</strong> · ` +
          `Rating: <strong>${juegoCercano.rating}%</strong>.`;
      } else {
        info.innerHTML = `Cerca de <strong>${juegoCercano.nombre}</strong> · ` +
          `Precio: $${formatearPrecio(juegoCercano.precio)} · Rating: ${juegoCercano.rating}%.`;
      }
    }

    // --- Eventos ---
    Protobject.Core.onReceived((datos) => {
      if (datos.accion === "nuevosJuegos") { generarNuevaTorre(); return; }
      procesarMovimiento(datos);
    });

    // Al cambiar el género, regenerar la torre automáticamente
    selectorGenero.addEventListener("change", generarNuevaTorre);

    btnNuevaTorre.addEventListener("click", generarNuevaTorre);
    btnActivarSonido.addEventListener("click", activarSonido);
    window.addEventListener("resize", dibujarTorre);

    cargarDatosTorre();
  </script>
</body>
</html>
