<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Fisicalización - Mejores Juegos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
  <style>
    #contenedor-radar-tesoros { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 50px; }
    #mapa { width: 800px; height: 500px; background-color: rgba(26, 28, 44, 0.9); background-image: linear-gradient(rgba(0, 210, 200, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 210, 200, 0.1) 1px, transparent 1px); background-size: 50px 50px; border: 2px solid #00d2c8; border-radius: 10px; position: relative; box-shadow: 0 0 30px rgba(0, 210, 200, 0.2); overflow: hidden; }
    .eje-y { position: absolute; left: -80px; top: 50%; transform: translateY(-50%) rotate(-90deg); color: #d6d6d6; font-weight: bold; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px;}
    .eje-x { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); color: #d6d6d6; font-weight: bold; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px;}
    #cursor { width: 30px; height: 30px; border: 3px solid #f5c518; border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); transition: left 0.1s linear, top 0.1s linear; z-index: 10; box-shadow: 0 0 15px #f5c518; pointer-events: none; }
    #cursor::after { content: '+'; color: #f5c518; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; }
    .punto { position: absolute; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0.7; }
    .joya { background: #00d2c8; box-shadow: 0 0 10px #00d2c8; }
    .decepcion { background: #ff6384; opacity: 0.4; }
    #info { margin-top: 40px; font-size: 1.2rem; color: #d6d6d6; font-family: 'Rajdhani', sans-serif; text-align: center; max-width: 800px;}
    #ProtobjectPlusButton { top: 100px !important; left: 20px !important; border-radius: 30px !important; z-index: 2000; }
    #ProtobjectPlusButton:after { content: " Conectar celular"; }
  </style>

  <script>
    window.onerror = function(mensaje, origen, linea) {
      const infoDiv = document.getElementById('info');
      if (infoDiv) {
        infoDiv.innerHTML = `❌ Error fatal en la línea ${linea}: <br> ${mensaje}`;
        infoDiv.style.color = "#ff6384";
      }
    };
  </script>
</head>
<body>

  <header class="encabezado">
    <div class="marca"><h1>Mejores Juegos</h1></div>
    <nav class="navbar">
      <a class="nav-btn" href="index.html">Volver al Proyecto</a>
      <a class="nav-btn activo" style="color: #00d2c8; border-color: #00d2c8;" href="fisicalizacion.html">Fisicalización</a>
    </nav>
  </header>

  <main class="contenido">
    <div class="hero" style="margin-top: 20px; text-align:center;">
      <h2 style="color: #00d2c8; margin-top: 0;">Radar de Tesoros Ocultos</h2>
      <p class="bajada">Conecta tu celular y usa el giroscopio para buscar juegos.</p>
    </div>

    <div id="contenedor-radar-tesoros">
      <div style="position: relative;">
        <div class="eje-y">Rating de Calidad (%)</div>
        <div id="mapa"><div id="cursor"></div></div>
        <div class="eje-x">Precio (USD)</div>
      </div>
      <div id="info">Cargando datos reales...</div>
    </div>
  </main>

  <script src="https://app.protobject.com/framework/p.js"></script>
  <script>
    const mapa = document.getElementById('mapa');
    const cursor = document.getElementById('cursor');
    const info = document.getElementById('info');
    let joyas = [];
    let decepciones = [];

    // --- CARGAR DATOS ---
    async function cargarDatosParaRadar() {
      try {
          const respuesta = await fetch('datos/datos_radar.json');
          if (!respuesta.ok) throw new Error("No se pudo leer el archivo JSON.");
          
          const datosJuegos = await respuesta.json();
          const masivos = datosJuegos.filter(j => (j["Estimated owners"] || 0) >= 2000000);
          
          joyas = masivos.filter(j => (j.Price || 0) <= 20 && (j.rating || 0) >= 90)
                         .map(j => ({ nombre: j.Name, x: ((j.Price || 0) / 80) * 100, y: (j.rating || 0) }));
          decepciones = masivos.filter(j => (j.Price || 0) <= 40 && (j.rating || 0) < 60)
                               .map(j => ({ nombre: j.Name, x: ((j.Price || 0) / 80) * 100, y: (j.rating || 0) }));

          dibujarPuntos(joyas, 'joya');
          dibujarPuntos(decepciones, 'decepcion');
          
          info.innerHTML = "¡Datos cargados! Haz clic en 'Conectar celular' (botón flotante arriba a la izquierda).";
          info.style.color = "#00d2c8";
      } catch (error) {
          info.innerHTML = "❌ Error al cargar datos: " + error.message;
          info.style.color = "#ff6384";
      }
    }

    function dibujarPuntos(arreglo, claseCSS) {
      arreglo.forEach(p => {
        let div = document.createElement('div');
        div.className = `punto ${claseCSS}`;
        div.style.left = `${Math.min(p.x, 100)}%`; 
        div.style.top = `${100 - p.y}%`; 
        mapa.appendChild(div);
      });
    }

    // --- SINTETIZADOR DE AUDIO (Corregido para bloqueos) ---
    let audioCtx = null;
    let ultimoClic = 0;

    function hacerClic(frecuencia) {
      // Solo se crea si ya empezamos a interactuar
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(frecuencia, audioCtx.currentTime); 
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // --- CONEXIÓN DE PROTOBJECT ---
    Protobject.Core.onReceived((datos) => {
      cursor.style.left = `${datos.x}%`;
      cursor.style.top = `${datos.y}%`;

      let cursorRating = 100 - datos.y; 
      let distanciaMinima = Infinity;
      let joyaCercana = null;

      joyas.forEach(j => {
        let dx = j.x - datos.x;
        let dy = j.y - cursorRating;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < distanciaMinima) { distanciaMinima = dist; joyaCercana = j; }
      });

      const ahora = Date.now();
      if (distanciaMinima < 20) {
        info.innerHTML = `¡Tesoro cerca! Buscando...`;
        info.style.color = "#00d2c8";
        let intervalo = Math.max(50, distanciaMinima * 25); 
        let frecuencia = 800 - (distanciaMinima * 20); 

        if (ahora - ultimoClic > intervalo) {
          hacerClic(frecuencia);
          Protobject.Core.send({ vibrar: true, duracion: 30 }).to("sensor.html");
          ultimoClic = ahora;
        }
        if (distanciaMinima < 3) {
          info.innerHTML = `¡ENCONTRASTE: <strong>${joyaCercana.nombre}</strong>!`;
          info.style.color = "#f5c518";
        }
      } else {
        info.innerHTML = `Zonas vacías o decepcionantes...`;
        info.style.color = "#ff6384";
      }
    });

    cargarDatosParaRadar();
  </script>
  <script src="config.js"></script>
</body>
</html>
