<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sensor Radar</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; padding: 20px; margin: 0; background: #fafafa; text-align: center; }
    #instr { font-size: 22px; margin-top: 20px; color: #333; }
    #valor { font-size: 40px; margin: 30px 0; color: #2a7; font-weight: bold; }
    button { display: block; width: 100%; font-weight: bold; border: none; border-radius: 14px; margin: 15px 0; padding: 25px; font-size: 22px; cursor: pointer; }
    #permiso { background: #e63946; color: white; }
    #calibrar { background: #2a7; color: white; }
    #calibrar:active { background: #1a5; }
  </style>
</head>
<body>

  <button id="permiso">PEDIR PERMISO DE ORIENTACIÓN</button>
  <div id="instr">Pon el teléfono frente a ti como una linterna.</div>
  <button id="calibrar" style="display:none">📍 CALIBRAR CENTRO</button>
  <div id="valor">—</div>

  <script src="https://app.protobject.com/framework/p.js"></script>

  <script>
    const instr = document.getElementById("instr");
    const valorEl = document.getElementById("valor");
    const btnCalibrar = document.getElementById("calibrar");
    const btnPermiso = document.getElementById("permiso");

    let origenBeta = null;
    let origenGamma = null;

    // Recibir la orden de vibrar desde el PC
    Protobject.Core.onReceived((msg) => {
      if (msg.vibrar && navigator.vibrate) {
        navigator.vibrate(msg.duracion);
      }
    });

    // Leer el giroscopio
    function handler(event) {
      if (origenBeta === null || event.beta === null || event.gamma === null) return;

      let dy = event.beta - origenBeta;   
      let dx = event.gamma - origenGamma; 

      dx = Math.max(-45, Math.min(45, dx));
      dy = Math.max(-45, Math.min(45, dy));

      let posX = ((dx + 45) / 90) * 100;
      let posY = ((dy + 45) / 90) * 100;
      posY = 100 - posY; 

      valorEl.textContent = `X: ${Math.round(posX)}% | Y: ${Math.round(posY)}%`;

      // Enviar los datos exactos a fisicalizacion.html
      Protobject.Core.send({ x: posX, y: posY }).to("fisicalizacion.html");
    }

    btnPermiso.addEventListener("click", async () => {
      try {
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
          const respuesta = await DeviceOrientationEvent.requestPermission();
          if (respuesta === "granted") iniciar();
        } else {
          iniciar();
        }
      } catch (err) {
        instr.textContent = "Error: " + err.message;
      }
    });

    function iniciar() {
      btnPermiso.style.display = "none";
      btnCalibrar.style.display = "block";
      instr.textContent = "Pon el teléfono al centro y toca calibrar.";
      window.addEventListener("deviceorientation", handler, true);
    }

    btnCalibrar.addEventListener("click", () => {
      const tempHandler = (e) => {
        origenBeta = e.beta;
        origenGamma = e.gamma;
        instr.textContent = "✓ Calibrado. Inclina el celular para mover la mira en tu PC.";
        btnCalibrar.textContent = "🔄 RECALIBRAR";
        window.removeEventListener("deviceorientation", tempHandler);
      };
      window.addEventListener("deviceorientation", tempHandler);
    });

    if (typeof DeviceOrientationEvent === "undefined" || typeof DeviceOrientationEvent.requestPermission !== "function") {
      iniciar();
    }
  </script>
  <script src="config.js"></script>
</body>
</html>
