<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Fisicalización - Mejores Juegos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <h1>Radar de Tesoros Ocultos</h1>
  <p>Conecta tu celular con el botón flotante para empezar.</p>

  <div id="mapa" style="width:800px; height:500px; border:2px solid black; position:relative; overflow:hidden;">
    <div id="cursor" style="width:30px; height:30px; border:3px solid orange; border-radius:50%; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none;">+</div>
  </div>

  <div id="info">Cargando datos reales...</div>

  <script src="https://app.protobject.com/framework/p.js"></script>
  <script>
    const mapa   = document.getElementById('mapa');
    const cursor = document.getElementById('cursor');
    const info   = document.getElementById('info');
    let joyas = [];
    let decepciones = [];

    async function cargarDatosParaRadar() {
      try {
        const respuesta = await fetch('datos/datos_radar.json');
        if (!respuesta.ok) throw new Error("No se pudo leer el archivo JSON.");

        const datosJuegos = await respuesta.json();
        const masivos = datosJuegos.filter(j => (j["Estimated owners"] || 0) >= 2000000);

        joyas = masivos
          .filter(j => (j.Price || 0) <= 20 && (j.rating || 0) >= 90)
          .map(j => ({ nombre: j.Name, x: ((j.Price || 0) / 80) * 100, y: (j.rating || 0) }));

        decepciones = masivos
          .filter(j => (j.Price || 0) <= 40 && (j.rating || 0) < 60)
          .map(j => ({ nombre: j.Name, x: ((j.Price || 0) / 80) * 100, y: (j.rating || 0) }));

        dibujarPuntos(joyas, 'cyan');
        dibujarPuntos(decepciones, 'red');

        info.textContent = "¡Datos cargados!";
      } catch (error) {
        info.textContent = "❌ Error al cargar datos: " + error.message;
      }
    }

    function dibujarPuntos(arreglo, color) {
      arreglo.forEach(p => {
        const div = document.createElement('div');
        div.style.cssText = `width:12px; height:12px; border-radius:50%; background:${color}; position:absolute; transform:translate(-50%,-50%);`;
        div.style.left = `${Math.min(p.x, 100)}%`;
        div.style.top  = `${100 - p.y}%`;
        mapa.appendChild(div);
      });
    }

    let audioCtx   = null;
    let ultimoClic = 0;

    function hacerClic(frecuencia) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(frecuencia, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    Protobject.Core.onReceived((datos) => {
      cursor.style.left = `${datos.x}%`;
      cursor.style.top  = `${datos.y}%`;

      const cursorRating = 100 - datos.y;
      let distanciaMinima = Infinity;
      let joyaCercana = null;

      joyas.forEach(j => {
        const dist = Math.sqrt((j.x - datos.x) ** 2 + (j.y - cursorRating) ** 2);
        if (dist < distanciaMinima) { distanciaMinima = dist; joyaCercana = j; }
      });

      const ahora = Date.now();

      if (distanciaMinima < 20) {
        info.textContent = "¡Tesoro cerca! Buscando...";
        const intervalo  = Math.max(50, distanciaMinima * 25);
        const frecuencia = 800 - (distanciaMinima * 20);
        if (ahora - ultimoClic > intervalo) {
          hacerClic(frecuencia);
          Protobject.Core.send({ vibrar: true, duracion: 30 }).to("sensor.html");
          ultimoClic = ahora;
        }
        if (distanciaMinima < 3) {
          info.textContent = "¡ENCONTRASTE: " + joyaCercana.nombre + "!";
        }
      } else {
        info.textContent = "Zonas vacías o decepcionantes...";
      }
    });

    cargarDatosParaRadar();
  </script>
  <script src="config.js"></script>

</body>
</html>
