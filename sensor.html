<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sensor Radar</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif; padding: 20px; margin: 0;
      background: #1a1c2c; text-align: center; color: #d6d6d6;
    }
    #instr { font-size: 22px; margin-top: 20px; color: #d6d6d6; }
    #valor { font-size: 36px; margin: 30px 0; color: #00d2c8; font-weight: bold; }
    button {
      display: block; width: 100%;
      font-weight: bold; border: none; border-radius: 14px;
      margin: 15px 0; padding: 25px; font-size: 22px; cursor: pointer;
      touch-action: manipulation;
    }
    #permiso { background: #e63946; color: white; }
    #calibrar { background: #00d2c8; color: #1a1c2c; display: none; }
    #calibrar:active { background: #00aaa6; }
  </style>
</head>
<body>

  <button id="permiso">PEDIR PERMISO DE ORIENTACIÓN</button>
  <div id="instr">Pon el teléfono frente a ti como una linterna.</div>
  <button id="calibrar">📍 CALIBRAR CENTRO</button>
  <div id="valor">—</div>

  <script src="https://app.protobject.com/framework/p.js"></script>
  <script>
    const instr    = document.getElementById("instr");
    const valorEl  = document.getElementById("valor");
    const btnCal   = document.getElementById("calibrar");
    const btnPerm  = document.getElementById("permiso");

    let origenBeta  = null;
    let origenGamma = null;

    // Recibir orden de vibrar desde la pantalla
    Protobject.Core.onReceived((msg) => {
      if (msg.vibrar && navigator.vibrate) {
        navigator.vibrate(msg.duracion || 30);
      }
    });

    function handler(event) {
      if (event.beta === null || event.gamma === null) return;
      if (origenBeta === null) return; // sin calibrar aún

      let dy = event.beta  - origenBeta;
      let dx = event.gamma - origenGamma;

      // Limitar rango a ±45°
      dx = Math.max(-45, Math.min(45, dx));
      dy = Math.max(-45, Math.min(45, dy));

      // Convertir a porcentaje 0-100
      const posX = ((dx + 45) / 90) * 100;
      const posY = ((dy + 45) / 90) * 100;

      valorEl.textContent = `X: ${Math.round(posX)}% | Y: ${Math.round(posY)}%`;
      Protobject.Core.send({ x: posX, y: posY }).to("fisicalizacion.html");
    }

    function iniciar() {
      btnPerm.style.display = "none";
      btnCal.style.display  = "block";
      instr.textContent = "Pon el teléfono al centro y toca calibrar.";
      window.addEventListener("deviceorientation", handler, true);
    }

    btnPerm.addEventListener("click", async () => {
      try {
        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          const r = await DeviceOrientationEvent.requestPermission();
          if (r === "granted") iniciar();
          else instr.textContent = "Permiso denegado. Recarga e intenta de nuevo.";
        } else {
          iniciar();
        }
      } catch (err) {
        instr.textContent = "Error: " + err.message;
      }
    });

    function calibrar(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      // Capturar posición actual como centro
      const captura = (ev) => {
        origenBeta  = ev.beta;
        origenGamma = ev.gamma;
        instr.textContent = "✓ Calibrado. Inclina el celular para mover la mira.";
        btnCal.textContent = "🔄 RECALIBRAR";
        window.removeEventListener("deviceorientation", captura);
      };
      window.addEventListener("deviceorientation", captura);
    }

    btnCal.addEventListener("touchstart", calibrar);
    btnCal.addEventListener("click", calibrar);

    // Android no necesita permiso explícito
    if (typeof DeviceOrientationEvent === "undefined" ||
        typeof DeviceOrientationEvent.requestPermission !== "function") {
      iniciar();
    }
  </script>

  <script src="config.js"></script>
</body>
</html>
